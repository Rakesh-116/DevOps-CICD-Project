name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test and verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: devops-cicd-app
      CONTAINER_NAME: devops-cicd-app
      HOST_PORT: 5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v test_app

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Run Docker container
        run: docker run -d --name $CONTAINER_NAME -p $HOST_PORT:5000 $IMAGE_NAME:${{ github.sha }}

      - name: Verify application is responding
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:$HOST_PORT/health; then
              echo
              echo "Application is healthy"
              docker logs $CONTAINER_NAME
              exit 0
            fi
            echo "Waiting for application... ($i/15)"
            sleep 2
          done
          echo "Application did not become healthy in time"
          docker logs $CONTAINER_NAME
          exit 1

      - name: Save image as artifact
        run: docker save $IMAGE_NAME:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

  deploy:
    name: Deploy to Docker host
    # Runs only when the repository variable DEPLOY_ENABLED is set to "true".
    # Until then the pipeline stops after build-test.
    needs: build-test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_NAME: devops-cicd-app
      CONTAINER_NAME: devops-cicd-app
      REMOTE_PORT: 8080

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Copy image and run container over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          scp $SSH_OPTS image.tar.gz "$DEPLOY_TARGET:/tmp/devops-cicd-app.tar.gz"

          ssh $SSH_OPTS "$DEPLOY_TARGET" bash -s -- "$IMAGE_NAME" "$IMAGE_TAG" "$CONTAINER_NAME" "$REMOTE_PORT" <<'REMOTE'
          set -euo pipefail
          IMAGE_NAME="$1"
          IMAGE_TAG="$2"
          CONTAINER_NAME="$3"
          REMOTE_PORT="$4"

          gunzip -c /tmp/devops-cicd-app.tar.gz | docker load
          rm -f /tmp/devops-cicd-app.tar.gz

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
            -p "$REMOTE_PORT":5000 "$IMAGE_NAME:$IMAGE_TAG"

          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:$REMOTE_PORT/health"; then
              echo
              echo "Deployed container is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER_NAME"
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
